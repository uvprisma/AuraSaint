<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="AuraSaint - Exclusive Streetwear. Only Faith. Faith Over Fear.">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AURASAINT | ONLY FAITH COLLECTION</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Montserrat:wght@200;300;400;500;600&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* ====================================================================
           1.0 ARQUITECTURA VISUAL (VARIABLES & RESET)
           ==================================================================== */
        :root {
            /* PALETA DE COLORES */
            --bg-deep: #050505;
            --bg-card: #0a0a0a;
            --bg-drawer: rgba(10, 10, 10, 0.98);
            
            /* ORO LUXURY - Gradientes y acentos */
            --gold-primary: #D4AF37;
            --gold-light: #F4C430;
            --gold-dark: #8a7018;
            --gold-gradient: linear-gradient(135deg, #ae8625 0%, #f7ef8a 50%, #d2ac47 100%);
            --gold-text-shine: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);

            /* TEXTO */
            --text-main: #ffffff;
            --text-muted: #888888;
            
            /* TIPOGRAFÍA */
            --font-title: 'Cinzel', serif;
            --font-body: 'Montserrat', sans-serif;
            --font-tech: 'Syncopate', sans-serif;

            /* DIMENSIONES & UI */
            --header-height: 80px;
            --border-radius: 2px;
            
            /* EFECTOS */
            --shadow-glow: 0 0 25px rgba(212, 175, 55, 0.2);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* RESET AVANZADO */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            background-color: var(--bg-deep);
        }

        body {
            font-family: var(--font-body);
            color: var(--text-main);
            background-color: var(--bg-deep);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* UTILIDADES GLOBALES */
        a { text-decoration: none; color: inherit; transition: var(--transition-smooth); }
        ul { list-style: none; }
        img { display: block; width: 100%; height: auto; user-select: none; }
        
        .text-gold { color: var(--gold-primary); }
        .text-gradient { 
            background: var(--gold-text-shine); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-size: 200% auto;
            animation: shine 6s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; transition: background 0.3s; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }

        /* ====================================================================
           2.0 UI COMPONENTS (BOTONES & ICONOS)
           ==================================================================== */
        .btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 16px 36px;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--gold-primary);
            background: transparent;
            border: 1px solid var(--gold-primary);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition-smooth);
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--gold-gradient);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
            transform: translateX(0);
        }

        .btn:hover { 
            color: #000; 
            border-color: transparent; 
            box-shadow: var(--shadow-glow); 
            transform: translateY(-2px);
        }
        
        .btn:hover::before { transform: translateX(100%); }

        .btn-icon {
            font-size: 1.2rem;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            border: var(--glass-border);
            backdrop-filter: blur(5px);
            transition: var(--transition-smooth);
        }
        
        .btn-icon:hover { 
            background: var(--gold-primary); 
            color: #000; 
            transform: rotate(10deg) scale(1.05); 
            border-color: var(--gold-primary);
        }
        .btn-icon:hover i { color: #000 !important; }

        /* ====================================================================
           3.0 HEADER & NAVEGACIÓN
           ==================================================================== */
        header {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 1000;
            transition: var(--transition-smooth);
            background: transparent;
        }

        header.scrolled {
            background: rgba(5, 5, 5, 0.85);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border-bottom: var(--glass-border);
            height: 70px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 35px;
            width: auto;
            filter: invert(1); 
            transition: transform 0.4s ease;
        }
        
        .brand-container:hover .logo-img { transform: scale(1.05); }

        .brand-name {
            font-family: var(--font-title);
            font-size: 1.3rem;
            letter-spacing: 2px;
            font-weight: 600;
            color: #fff;
        }

        .nav-actions {
            display: flex;
            align-items: center;
        }

        .cart-trigger {
            position: relative;
            cursor: pointer;
        }

        .cart-count {
            position: absolute;
            top: -6px; right: -6px;
            background: var(--gold-primary);
            color: #000;
            font-size: 0.65rem;
            width: 20px; height: 20px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800;
            opacity: 0;
            transform: scale(0);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .cart-count.active { opacity: 1; transform: scale(1); }

        /* ====================================================================
           4.0 HERO SECTION
           ==================================================================== */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('front.jpg') no-repeat center center;
            background-size: cover;
            filter: brightness(0.25) contrast(1.15); 
            transform: scale(1.05);
            animation: breathe 25s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { transform: scale(1.05); }
            100% { transform: scale(1.12); }
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, #050505 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
        }

        .hero-subtitle {
            font-family: var(--font-tech);
            color: var(--gold-light);
            letter-spacing: 8px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: block;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .hero-title {
            font-family: var(--font-title);
            font-size: clamp(3.5rem, 10vw, 8rem);
            line-height: 0.9;
            margin-bottom: 40px;
            text-shadow: 0 10px 40px rgba(0,0,0,0.9);
            font-weight: 800;
        }

        .hero-title span { display: block; }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        
        .scroll-indicator:hover { opacity: 1; }

        .mouse {
            width: 22px; height: 38px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 15px;
            margin-bottom: 12px;
            position: relative;
        }

        .mouse::after {
            content: '';
            position: absolute;
            top: 6px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 6px;
            background: #fff;
            border-radius: 2px;
            animation: scroll 2s cubic-bezier(0.15, 0.41, 0.69, 0.94) infinite;
        }

        @keyframes scroll {
            0% { opacity: 1; top: 6px; }
            100% { opacity: 0; top: 18px; }
        }

        /* ====================================================================
           5.0 SHOP SECTION (GRID)
           ==================================================================== */
        .shop-section {
            padding: 120px 5%;
            background: var(--bg-deep);
            position: relative;
        }

        .shop-section::before {
            content: 'AURASAINT';
            position: absolute;
            top: 60px; left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-tech);
            font-size: 15vw;
            color: rgba(255,255,255,0.015);
            font-weight: 900;
            pointer-events: none;
            white-space: nowrap;
        }

        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 70px;
            position: relative;
            z-index: 2;
        }

        .product-card {
            background: transparent;
            border-radius: var(--border-radius);
            position: relative;
            group: 'product';
        }

        .product-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4; 
            background: #0a0a0a;
            overflow: hidden;
            margin-bottom: 25px;
            border: var(--glass-border);
            transition: border-color 0.5s ease;
        }

        .product-card:hover .product-image-wrapper {
            border-color: rgba(212, 175, 55, 0.5);
        }

        .prod-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }

        .img-front { z-index: 2; }
        
        .img-back {
            opacity: 0;
            transform: scale(1.05);
            z-index: 1;
        }

        /* Hover refinado de imágenes */
        .product-card:hover .img-front { opacity: 0; transform: scale(1.05); }
        .product-card:hover .img-back { opacity: 1; transform: scale(1); z-index: 3; }

        .product-info { text-align: center; }

        .product-title {
            font-family: var(--font-title);
            font-size: 1.6rem;
            font-weight: 400;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .product-price {
            font-family: var(--font-tech);
            color: var(--gold-primary);
            font-size: 1rem;
            margin-bottom: 20px;
            display: block;
        }

        .product-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            opacity: 0;
            transform: translateY(15px);
            transition: var(--transition-smooth);
        }

        .product-card:hover .product-actions {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .product-actions { opacity: 1; transform: translateY(0); margin-top: 20px; }
            .grid-container { gap: 60px; }
            .shop-section { padding: 90px 5%; }
            .hero-title { font-size: 3.5rem; }
        }

        /* ====================================================================
           6.0 FOOTER & CONTACT
           ==================================================================== */
        footer {
            padding: 80px 5% 50px;
            border-top: 1px solid rgba(255,255,255,0.03);
            background: #020202;
            text-align: center;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 35px;
            align-items: center;
        }

        .footer-logo {
            font-family: var(--font-title);
            font-size: 2rem;
            color: #fff;
            letter-spacing: 3px;
        }

        .footer-links {
            display: flex;
            gap: 25px;
        }

        .contact-email {
            font-family: var(--font-tech);
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            padding-bottom: 3px;
            transition: all 0.3s ease;
        }
        
        .contact-email:hover { 
            color: var(--gold-primary); 
            border-color: var(--gold-primary); 
        }

        .copyright {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #444;
            font-family: var(--font-body);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ====================================================================
           7.0 CART DRAWER (UX MEJORADA)
           ==================================================================== */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            z-index: 1001;
            opacity: 0; visibility: hidden;
            transition: var(--transition-smooth);
        }
        .overlay.active { opacity: 1; visibility: visible; }

        .cart-drawer {
            position: fixed; top: 0; right: 0;
            width: 100%; max-width: 420px; height: 100%;
            background: var(--bg-drawer);
            border-left: var(--glass-border);
            z-index: 1002;
            transform: translateX(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        }

        .cart-drawer.active { transform: translateX(0); }

        .drawer-header {
            padding: 30px;
            border-bottom: var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .drawer-title { font-family: var(--font-tech); color: #fff; letter-spacing: 2px; font-size: 0.9rem;}
        
        .close-cart { 
            font-size: 1.5rem; cursor: pointer; color: #666; 
            transition: all 0.4s ease; 
        }
        .close-cart:hover { color: var(--gold-primary); transform: rotate(90deg); }

        .drawer-body {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .empty-cart {
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #444;
        }

        .cart-item {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeInRight { 
            from { opacity: 0; transform: translateX(20px); } 
            to { opacity: 1; transform: translateX(0); } 
        }

        .cart-item img { width: 75px; height: 100px; object-fit: cover; border-radius: 2px; }
        
        .cart-details h4 { color: #fff; font-family: var(--font-title); margin-bottom: 5px; font-size: 1rem; }
        .cart-details p { color: var(--text-muted); font-family: var(--font-tech); font-size: 0.75rem; margin-bottom: 5px;}
        .cart-details .price { color: var(--gold-primary); font-family: var(--font-tech); font-size: 0.85rem; }
        
        .remove-btn { 
            color: #cc3333; font-size: 0.7rem; margin-top: 12px; cursor: pointer; 
            display: inline-block; text-transform: uppercase; letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        .remove-btn:hover { color: #ff4c4c; }

        .drawer-footer {
            padding: 30px;
            border-top: var(--glass-border);
            background: #080808;
        }

        .total-row {
            display: flex; justify-content: space-between;
            color: #fff; font-family: var(--font-tech); font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* ====================================================================
           8.0 TOAST & WHATSAPP
           ==================================================================== */
        .toast {
            position: fixed; bottom: 40px; left: 50%; 
            transform: translate(-50%, 100px);
            background: rgba(212, 175, 55, 0.95);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            color: #000;
            padding: 14px 35px;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 30px;
            z-index: 2000;
            opacity: 0; visibility: hidden;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible;}

        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px;
            background: #25D366; color: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .whatsapp-float:hover { 
            transform: scale(1.1) translateY(-5px); 
            box-shadow: 0 15px 35px rgba(37,211,102,0.4); 
        }

    </style>
</head>
<body>

    <div id="toast" class="toast">ARTÍCULO AGREGADO</div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <aside class="cart-drawer" id="cartDrawer" aria-label="Carrito de compras">
        <div class="drawer-header">
            <span class="drawer-title">TU SELECCIÓN</span>
            <i class="fas fa-times close-cart" onclick="toggleCart()" aria-label="Cerrar carrito"></i>
        </div>
        <div class="drawer-body" id="cartBody">
            <div class="empty-cart">
                <i class="fas fa-shopping-bag" style="font-size: 2.5rem; margin-bottom: 20px; opacity: 0.15;"></i>
                <p style="font-family: var(--font-tech); letter-spacing: 2px; font-size: 0.8rem;">BOLSA VACÍA</p>
            </div>
        </div>
        <div class="drawer-footer">
            <div class="total-row">
                <span>TOTAL</span>
                <span class="text-gold" id="cartTotal">$0.00 MXN</span>
            </div>
            <button class="btn" style="width: 100%;" onclick="checkoutWhatsApp()">
                FINALIZAR PEDIDO <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
            </button>
        </div>
    </aside>

    <header id="navbar">
        <div class="brand-container">
            <img src="logo.jpg" alt="Aurasaint Logo" class="logo-img">
            <span class="brand-name">AURASAINT</span>
        </div>
        <nav class="nav-actions">
            <div class="cart-trigger btn-icon" onclick="toggleCart()" aria-label="Abrir carrito">
                <i class="fas fa-shopping-bag" style="color: #fff;"></i>
                <div class="cart-count" id="cartCount">0</div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-bg"></div>
            <div class="hero-overlay"></div>
            <div class="hero-content" data-aos="fade-up" data-aos-duration="1500">
                <span class="hero-subtitle">THE 2026 COLLECTION</span>
                <h1 class="hero-title">FAITH<br><span class="text-gradient">OVER</span><br>FEAR</h1>
                <a href="#shop" class="btn">VER COLECCIÓN</a>
            </div>
            <div class="scroll-indicator">
                <div class="mouse"></div>
                <span style="font-size: 0.6rem; letter-spacing: 3px; font-family: var(--font-tech); color: #fff;">SCROLL</span>
            </div>
        </section>

        <section id="shop" class="shop-section">
            <div class="grid-container">
                
                <article class="product-card" data-aos="fade-up" data-aos-delay="0">
                    <div class="product-image-wrapper">
                        <img src="front.jpg" alt="OnlyFaith Black Front" class="prod-img img-front" loading="lazy">
                        <img src="back.jpg" alt="OnlyFaith Black Back" class="prod-img img-back" loading="lazy">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">OnlyFaith</h3>
                        <span class="product-price">$650.00 MXN</span>
                        <div class="product-actions">
                            <button class="btn" onclick="addToCart('OnlyFaith', 650, 'front.jpg', 'Black')">
                                AGREGAR
                            </button>
                            <a href="https://www.instagram.com/aurasaint.co?igsh=MTBha2tqOTJtbG9hNA==" target="_blank" class="btn-icon" aria-label="Instagram AuraSaint">
                                <i class="fab fa-instagram" style="color: #fff;"></i>
                            </a>
                        </div>
                    </div>
                </article>

                <article class="product-card" data-aos="fade-up" data-aos-delay="150">
                    <div class="product-image-wrapper">
                        <img src="front2.jpg" alt="OnlyFaith White Front" class="prod-img img-front" style="filter: brightness(0.95);" loading="lazy">
                        <img src="back2.jpg" alt="OnlyFaith White Back" class="prod-img img-back" style="filter: brightness(0.95);" loading="lazy">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">OnlyFaith WHITE</h3>
                        <span class="product-price">$650.00 MXN</span>
                        <div class="product-actions">
                            <button class="btn" onclick="addToCart('OnlyFaith WHITE', 650, 'front2.jpg', 'White')">
                                AGREGAR
                            </button>
                            <a href="https://www.instagram.com/aurasaint.co?igsh=MTBha2tqOTJtbG9hNA==" target="_blank" class="btn-icon" aria-label="Instagram AuraSaint">
                                <i class="fab fa-instagram" style="color: #fff;"></i>
                            </a>
                        </div>
                    </div>
                </article>

            </div>
        </section>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        /* ====================================================================
           LÓGICA JAVASCRIPT REFACTORIZADA
           ==================================================================== */
        
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({
                once: true,
                offset: 50,
                duration: 1200,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
            });
        });

        // Efecto visual Navbar
        const header = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 60) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Estado Global del Carrito
        let cart = [];
        
        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            
            // Bloquear scroll de fondo si el carrito está abierto (Mejora UX en móvil)
            document.body.style.overflow = document.getElementById('cartDrawer').classList.contains('active') ? 'hidden' : '';
        }

        function addToCart(title, price, img, color) {
            const id = Date.now();
            cart.push({ id, title, price, img, color });
            renderCart();
            showToast();
            if(!document.getElementById('cartDrawer').classList.contains('active')) {
                toggleCart(); 
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartBody');
            const totalEl = document.getElementById('cartTotal');
            const countEl = document.getElementById('cartCount');
            
            // Update Badge
            countEl.innerText = cart.length;
            if(cart.length > 0) countEl.classList.add('active');
            else countEl.classList.remove('active');

            // Render Items
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-bag" style="font-size: 2.5rem; margin-bottom: 20px; opacity: 0.15;"></i>
                        <p style="font-family: var(--font-tech); letter-spacing: 2px; font-size: 0.8rem;">BOLSA VACÍA</p>
                    </div>`;
                totalEl.innerText = "$0.00 MXN";
            } else {
                let html = '';
                let total = 0;
                
                cart.forEach(item => {
                    total += item.price;
                    html += `
                        <div class="cart-item">
                            <img src="${item.img}" alt="${item.title}">
                            <div class="cart-details">
                                <h4>${item.title}</h4>
                                <p>${item.color} Edition</p>
                                <span class="price">$${item.price.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</span>
                                <br>
                                <span class="remove-btn" onclick="removeFromCart(${item.id})">REMOVER</span>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                totalEl.innerText = `$${total.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN`;
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // WhatsApp Checkout 
        function checkoutWhatsApp() {
            if (cart.length === 0) return;

            const phone = "526311295519";
            let message = "Qué onda AuraSaint. Vengo por la mercancía fina.%0A%0A*MI PEDIDO:*%0A";
            
            let total = 0;
            cart.forEach(item => {
                message += `▪️ ${item.title} (${item.color}) - $${item.price}%0A`;
                total += item.price;
            });

            message += `%0A*TOTAL A PAGAR: $${total.toLocaleString('es-MX')} MXN*%0A%0A¿Cómo cerramos el trato? Quedo al pendiente.`;

            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }

        // WhatsApp Directo
        function openDirectWhatsApp() {
            const phone = "526311295519";
            const message = "Qué rollo AuraSaint, me interesa la colección OnlyFaith. ¿Qué tallas tienes disponibles y cuál es el proceso de pago? Quedo al pendiente.";
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }
    </script>
